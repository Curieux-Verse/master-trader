name: _probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Reachability from a GitHub-hosted runner
        run: |
          echo "--- fapi.binance.com (trading API) ---"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://fapi.binance.com/fapi/v1/exchangeInfo" || true
          echo "--- data.binance.vision (bulk dump CDN) ---"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://data.binance.vision/data/futures/um/monthly/klines/BTCUSDT/4h/BTCUSDT-4h-2026-05.zip" || true
          echo "--- api.binance.com (spot) ---"
          curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://api.binance.com/api/v3/exchangeInfo" || true
