name: ingest-lake

# Builds the real, content-hashed data lake from the free feeds and caches it for the
# marathon. Crypto (Binance) needs no auth; FX/gold need the OANDA_API_KEY repo secret.
#
# TRIGGERING: fire it from an EXTERNAL scheduler (e.g. cron-job.org) via the GitHub API —
#   POST https://api.github.com/repos/Curieux-Verse/master-trader/dispatches
#   headers: Authorization: Bearer <PAT>,  Accept: application/vnd.github+json
#   body:    {"event_type":"run-ingest"}   (optionally add client_payload markets/top_n/deep_months)
# (or use the manual "Run workflow" button). Run once before the first marathon; refresh weekly.
on:
  workflow_dispatch:
    inputs:
      markets:
        description: "markets to ingest"
        default: "crypto,fx,xau"
      top_n:
        description: "crypto: top-N perps by 24h volume"
        default: "100"
      deep_months:
        description: "crypto: months of deep history via bulk dumps"
        default: "12"
  repository_dispatch:
    types: [run-ingest]

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Build the data lake
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}   # optional — FedWatch enrichment no-ops if unset
        run: |
          MARKETS="${{ github.event.inputs.markets || github.event.client_payload.markets || 'crypto,fx,xau' }}"
          TOPN="${{ github.event.inputs.top_n || github.event.client_payload.top_n || '100' }}"
          DEEP="${{ github.event.inputs.deep_months || github.event.client_payload.deep_months || '12' }}"
          python -m mt.run_ingest --markets "$MARKETS" --top-n "$TOPN" \
            --deep-months "$DEEP" --macro --calendar --fedwatch --snapshot-id real
      - name: Cache the lake for the marathon
        uses: actions/cache/save@v4
        with:
          path: var/lake
          key: lake-real-${{ github.run_id }}
