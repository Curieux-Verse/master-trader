name: marathon

# The unattended, self-improving discovery loop. Restores the lake + the accumulated "brain"
# (var/mt.db) from cache, runs discovery for a wall-clock budget, saves the brain back, commits
# a human-readable digest to runs/, and pings Telegram. Because the DB carries the hall-of-fame
# (best-ever genomes → an all-time best-z that ratchets), the QD archive, lessons, minted
# vocabulary, the engine bandit, AND warm-starts evolution from that frontier, discovery genuinely
# COMPOUNDS session to session (docs/14) — no machine needs to stay on. A durable state-branch
# snapshot guards the brain against >7-day cache eviction. NO capital is ever placed.
#
# TRIGGERING: fire it from an EXTERNAL scheduler (e.g. cron-job.org) via the GitHub API —
#   POST https://api.github.com/repos/Curieux-Verse/master-trader/dispatches
#   headers: Authorization: Bearer <PAT>,  Accept: application/vnd.github+json
#   body:    {"event_type":"run-marathon","client_payload":{"minutes":"300","reset":"false"}}
# (or use the manual "Run workflow" button). No built-in schedule — the external cron owns cadence.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "wall-clock budget (min); <6h so state saves before the hard cap"
        default: "300"
      reset:
        description: "start a FRESH brain (wipe accumulated var/mt.db) — true/false"
        default: "false"
  repository_dispatch:
    types: [run-marathon]

permissions:
  contents: write # commit the research-log digests back to the repo

concurrency:
  group: marathon # never run two marathons at once (they'd fork the brain)
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # hard backstop; --max-minutes exits cleanly before this
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install numba || echo "numba unavailable — pure-Python fallback will be used"

      - name: Restore data lake
        uses: actions/cache/restore@v4
        with:
          path: var/lake
          key: lake-real
          restore-keys: lake-real-
      - name: Require a lake
        run: |
          if [ ! -d var/lake/real ]; then
            echo "::error::No data lake in cache. Run the 'ingest-lake' workflow once first."
            exit 1
          fi

      - name: Restore accumulated brain (db)
        uses: actions/cache/restore@v4
        with:
          path: var/mt.db
          key: mtdb-${{ github.run_id }}
          restore-keys: mtdb-

      # Belt-and-suspenders durability (docs/14): the cache is fast but GitHub EVICTS it after 7
      # days of no access — a pause > 1 week would silently wipe weeks of compounding. If the cache
      # missed, restore the brain from the long-lived `state` branch snapshot (integrity-checked).
      - name: Durable-snapshot fallback (if brain cache missed)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f var/mt.db ]; then
            echo "brain restored from cache — durable snapshot not needed"
          elif gh release download brain-snapshot --pattern mt.db.gz --dir "$RUNNER_TEMP" --clobber 2>/dev/null; then
            python -m mt.store.snapshot restore --in "$RUNNER_TEMP/mt.db.gz" --db var/mt.db \
              && echo "brain restored from durable release snapshot (survived cache eviction)" \
              || echo "durable snapshot present but unreadable — starting a fresh brain"
          elif git fetch --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state 2>/dev/null \
               && git show FETCH_HEAD:mt.db.gz > "$RUNNER_TEMP/mt.db.gz" 2>/dev/null; then
            # legacy path: the pre-2026-07-29 orphan `state` branch, kept so an old snapshot is
            # still recoverable until the first release asset is published.
            python -m mt.store.snapshot restore --in "$RUNNER_TEMP/mt.db.gz" --db var/mt.db \
              && echo "brain restored from legacy state-branch snapshot" \
              || echo "legacy snapshot unreadable — starting a fresh brain"
          else
            echo "no durable snapshot yet (first run?) — starting a fresh brain"
          fi

      - name: Run the marathon
        env:
          SMC_BOT_TOKEN: ${{ secrets.SMC_BOT_TOKEN }}
          SMC_CHAT_ID: ${{ secrets.SMC_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          MINUTES="${{ github.event.inputs.minutes || github.event.client_payload.minutes || '300' }}"
          RESET_IN="${{ github.event.inputs.reset || github.event.client_payload.reset || 'false' }}"
          RESET=""; [ "$RESET_IN" = "true" ] && RESET="--reset"
          python -m mt.run_continuous --source lake --snapshot-id real \
            --generations 0 --max-minutes "$MINUTES" --report-every 10 $RESET

      - name: Save accumulated brain (db)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: var/mt.db
          key: mtdb-${{ github.run_id }}

      # Publish a compressed, integrity-checked snapshot as a RELEASE ASSET (docs/14).
      # This is the durable copy the fallback above restores from — so a >7-day pause can no longer
      # evict the accumulating brain.
      #
      # It used to be a blob on an orphan `state` branch. That broke permanently once the brain
      # crossed GitHub's 100 MiB per-FILE limit for git pushes: the 2026-07-28 snapshots were
      # rejected at 133.81 MB and 164.55 MB, which failed the whole job AFTER a full 5h of research
      # had already completed. Release assets have a 2 GB limit and never enter git history, so the
      # snapshot can grow with the brain. A single rolling tag is force-updated each run.
      - name: Persist durable brain snapshot (release asset)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f var/mt.db ] || { echo "no brain to snapshot"; exit 0; }
          python -m mt.store.snapshot save --db var/mt.db --out "$RUNNER_TEMP/mt.db.gz"
          sz=$(du -h "$RUNNER_TEMP/mt.db.gz" | cut -f1)
          gh release view brain-snapshot >/dev/null 2>&1 \
            || gh release create brain-snapshot --title "brain snapshot" --notes "rolling durable snapshot of var/mt.db (see docs/14)" --latest=false
          gh release upload brain-snapshot "$RUNNER_TEMP/mt.db.gz" --clobber
          gh release edit brain-snapshot --notes "rolling durable snapshot of var/mt.db — updated $(date -u +%FT%TZ) (${sz})" --latest=false
          echo "durable snapshot uploaded to release 'brain-snapshot' (${sz})"

      - name: Publish research log
        if: always()
        run: |
          python -m mt.run_genomes || true
          mkdir -p runs
          latest=$(ls -t var/runs/continuous_*_final.json 2>/dev/null | head -1)
          [ -n "$latest" ] && cp "$latest" runs/latest_report.json || true
          [ -f var/runs/genomes_current.md ] && cp var/runs/genomes_current.md runs/genomes_current.md || true
          git config user.name "master-trader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/
          git commit -m "chore(research-log): marathon digest $(date -u +%FT%TZ) [skip ci]" || echo "nothing to commit"
          # A marathon checks out main at launch and finishes ~5h later, so main has usually moved.
          # Without the rebase this push fails "fetch first" and the digest is silently lost — which
          # is why runs/ stopped updating on 2026-07-27 while the research itself was running fine.
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && { echo "digest published"; break; }
            echo "digest push attempt ${attempt} failed — retrying"
            sleep 5
          done
